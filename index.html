<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Elizabeth Eagles Tactics Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1a2fa0;
    --gold: #f5b800;
    --gold-dark: #d4a000;
    --bg: #0f1a5c;
    --panel: #1a2fa0;
    --panel2: #162590;
    --text: white;
    --subtext: rgba(255,255,255,0.7);
    --border: rgba(255,255,255,0.15);
    --input-bg: rgba(255,255,255,0.08);
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 12px 40px; gap: 12px;
    color: var(--text);
  }

  /* HEADER */
  .club-header {
    width: min(92vw, 400px);
    background: linear-gradient(135deg, #1a2fa0, #0f1a5c);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    border: 1.5px solid var(--gold);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .club-logo { width: 64px; height: 64px; object-fit: contain; flex-shrink: 0; }
  .club-name { font-size: 22px; font-weight: 800; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; line-height: 1; }
  .club-sub { font-size: 11px; font-weight: 600; color: var(--subtext); letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }

  /* PANELS */
  .panel {
    width: min(92vw, 400px);
    background: var(--panel);
    border-radius: 14px; padding: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .panel-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
  }

  /* COLOR ROW */
  .color-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .color-opt { flex: 1; padding: 7px; border-radius: 8px; border: 2px solid transparent; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.15s; }
  .color-opt.white-opt { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: white; }
  .color-opt.white-opt.selected { border-color: white; background: rgba(255,255,255,0.2); }
  .color-opt.gold-opt { background: var(--gold); color: #1a1a1a; border-color: var(--gold); }
  .color-opt.gold-opt.selected { border-color: white; box-shadow: 0 0 0 2px white; }

  /* INPUT */
  .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .input-row input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif;
    outline: none; color: white; background: var(--input-bg);
  }
  .input-row input::placeholder { color: rgba(255,255,255,0.4); }
  .input-row input:focus { border-color: var(--gold); }
  .add-btn {
    padding: 9px 18px; background: var(--gold); color: #1a1a1a;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 800;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }

  /* BENCH */
  .bench { display: flex; flex-wrap: wrap; gap: 6px; }
  .bench-chip {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.08); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 4px 8px 4px 6px;
    font-size: 12px; font-weight: 600; color: white; cursor: pointer;
    transition: all 0.12s;
  }
  .bench-chip:active { background: rgba(255,255,255,0.15); }
  .bench-chip.on-field { opacity: 0.4; pointer-events: none; }
  .chip-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); background: white; flex-shrink: 0; }
  .chip-dot.gold { background: var(--gold); border-color: var(--gold-dark); }
  .remove-x { margin-left: 2px; color: rgba(255,255,255,0.4); font-size: 14px; cursor: pointer; }

  /* GOALS */
  .goal-row {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; margin-bottom: 5px;
  }
  .goal-name { flex: 1; font-size: 12px; font-weight: 600; color: white; }
  .goal-count { font-size: 14px; font-weight: 800; color: var(--gold); min-width: 24px; text-align: center; }
  .goal-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    font-size: 16px; font-weight: 700; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif;
  }
  .goal-plus { background: var(--gold); color: #1a1a1a; }
  .goal-minus { background: rgba(255,255,255,0.1); color: white; }

  /* BOG */
  .bog-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; margin-bottom: 5px;
    cursor: pointer; transition: all 0.15s;
  }
  .bog-row.selected { background: rgba(245,184,0,0.2); border-color: var(--gold); }
  .bog-num { font-size: 11px; font-weight: 800; color: var(--gold); min-width: 20px; }
  .bog-select {
    flex: 1; border: none; background: transparent; color: white;
    font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    outline: none; cursor: pointer;
  }
  .bog-select option { background: #1a2fa0; color: white; }
  .bog-star { font-size: 16px; }

  /* POSITIONS */
  .positions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .position-row {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px;
  }
  .position-name { font-size: 9px; font-weight: 700; color: var(--gold); min-width: 60px; text-transform: uppercase; letter-spacing: 0.5px; }
  .position-select {
    flex: 1; border: none; background: transparent; color: white;
    font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    outline: none; cursor: pointer;
  }
  .position-select option { background: #1a2fa0; color: white; }

  /* NOTES */
  .notes-textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-family: 'DM Sans', sans-serif;
    color: white; background: var(--input-bg); resize: vertical;
    min-height: 100px; outline: none; line-height: 1.5;
  }
  .notes-textarea::placeholder { color: rgba(255,255,255,0.35); }
  .notes-textarea:focus { border-color: var(--gold); }

  /* BUTTONS */
  .clear-btn {
    width: 100%; margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.05);
    border: 1.5px solid var(--border); border-radius: 8px; font-size: 11px;
    font-weight: 700; color: rgba(255,255,255,0.5); cursor: pointer;
    font-family: 'DM Sans', sans-serif; letter-spacing: 1px; text-transform: uppercase;
  }
  .clear-btn:hover { border-color: rgba(255,100,100,0.5); color: rgba(255,100,100,0.8); }

  .save-status { text-align: center; font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px; min-height: 16px; }
  .save-status.saved { color: #4caf50; }
  .save-status.error { color: #e63946; }

  /* FIELD */
  #field-wrap { width: min(92vw, 400px); position: relative; }
  #fieldCanvas { width: 100%; border-radius: 12px; display: block; box-shadow: 0 6px 32px rgba(0,0,0,0.5); }
  #playerLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

  .player { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; cursor: grab; touch-action: none; user-select: none; z-index: 5; }
  .player:active { cursor: grabbing; z-index: 20; }
  .player-circle {
    width: 38px; height: 38px; border-radius: 50%;
    background: white; border: 2.5px solid rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #1a1a1a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); text-align: center; line-height: 1.1; padding: 2px;
  }
  .player-circle.gold { background: var(--gold); color: #1a1a1a; border-color: var(--gold-dark); }
  .player-name { margin-top: 2px; background: rgba(0,0,0,0.75); color: white; font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1; padding: 7px 4px; border-radius: 8px; border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5);
    font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
    font-family: 'DM Sans', sans-serif; letter-spacing: 0.5px; transition: all 0.15s;
  }
  .tab-btn.active { background: var(--gold); color: #1a1a1a; border-color: var(--gold); }
</style>
</head>
