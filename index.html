<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AFL Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #f0f0eb;
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 12px 40px; gap: 14px;
  }
  h1 { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #999; }
  .panel { width: min(92vw, 380px); background: white; border-radius: 14px; padding: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .panel-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #aaa; margin-bottom: 10px; }
  .color-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .color-opt { flex: 1; padding: 7px; border-radius: 8px; border: 2px solid transparent; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
  .color-opt.white-opt { background: white; border-color: #e0e0e0; color: #1a1a1a; }
  .color-opt.white-opt.selected { border-color: #1a1a1a; }
  .color-opt.red-opt { background: #e63946; color: white; border-color: #e63946; }
  .color-opt.red-opt.selected { border-color: #c1121f; box-shadow: 0 0 0 2px #c1121f; }
  .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .input-row input { flex: 1; border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; outline: none; color: #1a1a1a; background: #fafafa; }
  .input-row input:focus { border-color: #1a1a1a; background: white; }
  .add-btn { padding: 9px 18px; background: #1a1a1a; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .bench { display: flex; flex-wrap: wrap; gap: 6px; }
  .bench-chip { display: flex; align-items: center; gap: 5px; background: #f5f5f5; border: 1.5px solid #e8e8e8; border-radius: 20px; padding: 5px 10px 5px 6px; font-size: 12px; font-weight: 600; color: #333; cursor: pointer; }
  .bench-chip:active { background: #eee; }
  .bench-chip.on-field { opacity: 0.35; pointer-events: none; }
  .chip-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid #ccc; background: white; flex-shrink: 0; }
  .chip-dot.red { background: #e63946; border-color: #c1121f; }
  .remove-x { margin-left: 2px; color: #bbb; font-size: 14px; line-height: 1; cursor: pointer; padding: 0 2px; }
  .clear-btn { width: 100%; margin-top: 10px; padding: 8px; background: none; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 11px; font-weight: 700; color: #aaa; cursor: pointer; font-family: 'DM Sans', sans-serif; letter-spacing: 1px; text-transform: uppercase; }

  #field-wrap { width: min(92vw, 380px); position: relative; }
  #fieldCanvas { width: 100%; border-radius: 12px; display: block; box-shadow: 0 6px 32px rgba(0,0,0,0.25); }
  #playerLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

  .player { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; cursor: grab; touch-action: none; user-select: none; z-index: 5; }
  .player:active { cursor: grabbing; z-index: 20; }
  .player-circle { width: 36px; height: 36px; border-radius: 50%; background: white; border: 2px solid rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: #1a1a1a; box-shadow: 0 2px 6px rgba(0,0,0,0.35); text-align: center; line-height: 1.1; padding: 2px; }
  .player-circle.red { background: #e63946; color: white; }
  .player-name { margin-top: 2px; background: rgba(0,0,0,0.65); color: white; font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
</style>
</head>
<body>

<h1>AFL Tactics Board</h1>

<div class="panel">
  <div class="panel-label">Add Player</div>
  <div class="color-row">
    <div class="color-opt white-opt selected" id="opt-white" onclick="selectColor('white')">● White</div>
    <div class="color-opt red-opt" id="opt-red" onclick="selectColor('red')">● Red</div>
  </div>
  <div class="input-row">
    <input type="text" id="name-input" placeholder="Enter name..." maxlength="14"
           onkeydown="if(event.key==='Enter')addPlayer()">
    <button class="add-btn" onclick="addPlayer()">Add</button>
  </div>
  <div class="panel-label">Tap name to place on field</div>
  <div class="bench" id="bench"></div>
  <button class="clear-btn" onclick="clearAll()">Clear Field</button>
</div>

<div id="field-wrap">
  <canvas id="fieldCanvas"></canvas>
  <div id="playerLayer"></div>
</div>

<script>
// ─── Draw the field on canvas ───────────────────────────────────────────────
const canvas = document.getElementById('fieldCanvas');
const ctx = canvas.getContext('2d');
const playerLayer = document.getElementById('playerLayer');

// Canvas internal resolution
const CW = 400, CH = 600;
canvas.width = CW;
canvas.height = CH;

// Field geometry
const cx = CW / 2, cy = CH / 2;   // centre of oval
const ovalRx = 185, ovalRy = 284;  // oval radii

// Real AFL: field ~160m long, 50m arc radius = 50m
// Scale: 568px / 160m ≈ 3.55 px/m
// 50m arc radius in px = 50 * 3.55 ≈ 178px
const arcR = 178;

// The 50m arc is a circle of radius arcR centred on the goal line.
// Goal lines (top and bottom of oval interior):
const goalLineTop = cy - ovalRy;       // ≈ 16
const goalLineBot = cy + ovalRy;       // ≈ 584

// Top 50m arc: circle centred at (cx, goalLineTop), radius arcR
// We only draw the arc portion INSIDE the oval.
// The arc starts/ends where this circle intersects the oval.
// For drawing: just clip to oval and draw the full circle — 
//   only the inside portion shows. But canvas clip is easier.

function drawField() {
  ctx.clearRect(0, 0, CW, CH);

  // ── Oval clip path ──
  function ovalPath() {
    ctx.beginPath();
    ctx.ellipse(cx, cy, ovalRx, ovalRy, 0, 0, Math.PI * 2);
  }

  // Fill green
  ovalPath();
  ctx.fillStyle = '#2e9e2e';
  ctx.fill();

  // Clip everything to oval
  ctx.save();
  ovalPath();
  ctx.clip();

  ctx.strokeStyle = 'white';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  // ── TOP 50m arc ──
  // Circle centred at (cx, goalLineTop), radius arcR
  // Draw only the arc facing INTO the field (angles from ~30° to ~150° = lower half of circle)
  // Find intersection angles with oval at top:
  // The circle is centred at top of oval. Its lower arc (facing field) is what we see.
  // Since we're clipped to oval, just draw the full circle — only visible part shows.
  ctx.beginPath();
  ctx.arc(cx, goalLineTop, arcR, 0, Math.PI * 2);
  ctx.stroke();

  // ── BOTTOM 50m arc ──
  ctx.beginPath();
  ctx.arc(cx, goalLineBot, arcR, 0, Math.PI * 2);
  ctx.stroke();

  // ── Centre square (50m × 50m) ──
  // 50m = 178px, so half = 89px each side
  const sqHalf = 89;
  ctx.beginPath();
  ctx.rect(cx - sqHalf, cy - sqHalf, sqHalf * 2, sqHalf * 2);
  ctx.stroke();

  // ── Centre circle (3m radius = ~11px, but diagram shows ~10m circle visually) ──
  // The diagram shows a medium circle, representing the rover circle (~10m = 35px)
  ctx.beginPath();
  ctx.arc(cx, cy, 35, 0, Math.PI * 2);
  ctx.stroke();

  // ── Oval boundary ──
  ctx.lineWidth = 3.5;
  ovalPath();
  ctx.stroke();

  ctx.restore(); // remove oval clip

  // ── Goal squares & posts (outside clip so posts extend past oval) ──
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 3;

  // Top goal square: 9m deep (~32px), ~37px wide each side of centre
  const gsW = 74, gsH = 28;
  ctx.beginPath();
  ctx.rect(cx - gsW/2, goalLineTop, gsW, gsH);
  ctx.stroke();

  // Top posts
  ctx.lineWidth = 4.5;
  // Inner G posts (6.4m apart = ~23px each side of centre)
  ctx.beginPath(); ctx.moveTo(cx - 23, goalLineTop - 20); ctx.lineTo(cx - 23, goalLineTop); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 23, goalLineTop - 20); ctx.lineTo(cx + 23, goalLineTop); ctx.stroke();
  ctx.lineWidth = 2.5;
  // Outer B posts (6.4m further = ~23+23=46px from centre)
  ctx.beginPath(); ctx.moveTo(cx - 46, goalLineTop - 16); ctx.lineTo(cx - 46, goalLineTop); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 46, goalLineTop - 16); ctx.lineTo(cx + 46, goalLineTop); ctx.stroke();

  // Bottom goal square
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.rect(cx - gsW/2, goalLineBot - gsH, gsW, gsH);
  ctx.stroke();

  // Bottom posts
  ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(cx - 23, goalLineBot); ctx.lineTo(cx - 23, goalLineBot + 20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 23, goalLineBot); ctx.lineTo(cx + 23, goalLineBot + 20); ctx.stroke();
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(cx - 46, goalLineBot); ctx.lineTo(cx - 46, goalLineBot + 16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 46, goalLineBot); ctx.lineTo(cx + 46, goalLineBot + 16); ctx.stroke();
}

drawField();
loadState();

// ─── Player logic ────────────────────────────────────────────────────────────
let selectedColor = 'white';
let allPlayers = [];
let onField = [];
let pid = 0;

// ── Save & restore ──
function saveState() {
  const fieldPositions = onField.map(f => ({
    id: f.id,
    x: parseFloat(f.el.style.left),
    y: parseFloat(f.el.style.top)
  }));
  localStorage.setItem('afl_players', JSON.stringify(allPlayers));
  localStorage.setItem('afl_onfield', JSON.stringify(fieldPositions));
  localStorage.setItem('afl_pid', pid);
}

function loadState() {
  try {
    const savedPlayers = localStorage.getItem('afl_players');
    const savedOnField = localStorage.getItem('afl_onfield');
    const savedPid = localStorage.getItem('afl_pid');
    if (savedPlayers) allPlayers = JSON.parse(savedPlayers);
    if (savedPid) pid = parseInt(savedPid);
    if (savedOnField) {
      const positions = JSON.parse(savedOnField);
      positions.forEach(pos => {
        const p = allPlayers.find(p => p.id === pos.id);
        if (p) spawnToken(p, pos.x, pos.y);
      });
    }
    renderBench();
  } catch(e) { console.log('No saved state'); }
}

function selectColor(c) {
  selectedColor = c;
  document.getElementById('opt-white').classList.toggle('selected', c === 'white');
  document.getElementById('opt-red').classList.toggle('selected', c === 'red');
}

function addPlayer() {
  const input = document.getElementById('name-input');
  const name = input.value.trim();
  if (!name) return;
  const id = 'p' + (++pid);
  allPlayers.push({ id, name, color: selectedColor });
  input.value = '';
  renderBench();
  saveState();
}

function renderBench() {
  const bench = document.getElementById('bench');
  bench.innerHTML = '';
  allPlayers.forEach(p => {
    const onF = onField.find(f => f.id === p.id);
    const chip = document.createElement('div');
    chip.className = 'bench-chip' + (onF ? ' on-field' : '');
    const dot = document.createElement('div');
    dot.className = 'chip-dot' + (p.color === 'red' ? ' red' : '');
    const label = document.createElement('span');
    label.textContent = p.name;
    const x = document.createElement('span');
    x.className = 'remove-x'; x.textContent = '×';
    x.onclick = e => { e.stopPropagation(); deletePlayer(p.id); };
    chip.appendChild(dot); chip.appendChild(label); chip.appendChild(x);
    if (!onF) chip.onclick = () => placeOnField(p);
    bench.appendChild(chip);
  });
}

function placeOnField(p) {
  spawnToken(p, 38 + Math.random() * 24, 42 + Math.random() * 16);
  saveState();
}

function spawnToken(p, xPct, yPct) {
  const el = document.createElement('div');
  el.className = 'player';
  el.style.left = xPct + '%';
  el.style.top = yPct + '%';
  const initials = p.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
  el.innerHTML = `<div class="player-circle ${p.color === 'red' ? 'red' : ''}">${initials}</div><div class="player-name">${p.name}</div>`;
  makeDraggable(el, p.id);
  playerLayer.appendChild(el);
  onField.push({ id: p.id, el });
  renderBench();
}

function deletePlayer(id) {
  const fi = onField.findIndex(f => f.id === id);
  if (fi !== -1) { onField[fi].el.remove(); onField.splice(fi, 1); }
  allPlayers = allPlayers.filter(p => p.id !== id);
  renderBench();
  saveState();
}

function clearAll() {
  onField.forEach(f => f.el.remove());
  onField = [];
  renderBench();
  saveState();
}

function makeDraggable(el, id) {
  let sx, sy, sl, st, moved = false, longTimer = null;
  const getRect = () => playerLayer.getBoundingClientRect();

  el.addEventListener('touchstart', e => {
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY;
    sl = parseFloat(el.style.left); st = parseFloat(el.style.top);
    moved = false; el.style.zIndex = 20;
    longTimer = setTimeout(() => {
      if (!moved) { el.remove(); onField = onField.filter(f => f.id !== id); renderBench(); }
    }, 650);
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    clearTimeout(longTimer); moved = true; e.stopPropagation();
    const t = e.touches[0]; const r = getRect();
    el.style.left = Math.max(2, Math.min(98, sl + ((t.clientX - sx) / r.width) * 100)) + '%';
    el.style.top  = Math.max(2, Math.min(98, st + ((t.clientY - sy) / r.height) * 100)) + '%';
  }, { passive: false });

  el.addEventListener('touchend', () => { clearTimeout(longTimer); el.style.zIndex = 5; if (moved) saveState(); }, { passive: true });

  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return; e.preventDefault();
    sx = e.clientX; sy = e.clientY;
    sl = parseFloat(el.style.left); st = parseFloat(el.style.top);
    el.style.zIndex = 20;
    const move = e2 => {
      const r = getRect();
      el.style.left = Math.max(2, Math.min(98, sl + ((e2.clientX - sx) / r.width) * 100)) + '%';
      el.style.top  = Math.max(2, Math.min(98, st + ((e2.clientY - sy) / r.height) * 100)) + '%';
    };
    const up = () => { el.style.zIndex = 5; saveState(); document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}
</script>
</body>
</html>
