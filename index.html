<h1 style="font-size:50px;color:red;">
THIS IS THE NEW VERSION
</h1>
<script>
// AFL BOARD SAVE SYSTEM FIXED

const canvas = document.getElementById('fieldCanvas');
const ctx = canvas.getContext('2d');
const playerLayer = document.getElementById('playerLayer');
const saveStatus = document.getElementById('save-status');

const CW = 400, CH = 600;
canvas.width = CW;
canvas.height = CH;

const cx = CW / 2, cy = CH / 2;
const ovalRx = 185, ovalRy = 284;
const arcR = 178;
const goalLineTop = cy - ovalRy;
const goalLineBot = cy + ovalRy;

function drawField() {
  ctx.clearRect(0, 0, CW, CH);

  function ovalPath() {
    ctx.beginPath();
    ctx.ellipse(cx, cy, ovalRx, ovalRy, 0, 0, Math.PI * 2);
  }

  ovalPath();
  ctx.fillStyle = '#2e9e2e';
  ctx.fill();

  ctx.save();
  ovalPath();
  ctx.clip();

  ctx.strokeStyle = 'white';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  ctx.beginPath();
  ctx.arc(cx, goalLineTop, arcR, 0, Math.PI * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, goalLineBot, arcR, 0, Math.PI * 2);
  ctx.stroke();

  const sqHalf = 89;

  ctx.beginPath();
  ctx.rect(cx - sqHalf, cy - sqHalf, sqHalf * 2, sqHalf * 2);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, 35, 0, Math.PI * 2);
  ctx.stroke();

  ctx.lineWidth = 3.5;
  ovalPath();
  ctx.stroke();

  ctx.restore();

  ctx.strokeStyle = 'white';

  const gsW = 74, gsH = 28;

  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.rect(cx - gsW/2, goalLineTop, gsW, gsH);
  ctx.stroke();

  ctx.lineWidth = 4.5;

  ctx.beginPath();
  ctx.moveTo(cx-23, goalLineTop-20);
  ctx.lineTo(cx-23, goalLineTop);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx+23, goalLineTop-20);
  ctx.lineTo(cx+23, goalLineTop);
  ctx.stroke();

  ctx.lineWidth = 2.5;

  ctx.beginPath();
  ctx.moveTo(cx-46, goalLineTop-16);
  ctx.lineTo(cx-46, goalLineTop);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx+46, goalLineTop-16);
  ctx.lineTo(cx+46, goalLineTop);
  ctx.stroke();

  ctx.lineWidth = 3;

  ctx.beginPath();
  ctx.rect(cx - gsW/2, goalLineBot - gsH, gsW, gsH);
  ctx.stroke();

  ctx.lineWidth = 4.5;

  ctx.beginPath();
  ctx.moveTo(cx-23, goalLineBot);
  ctx.lineTo(cx-23, goalLineBot+20);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx+23, goalLineBot);
  ctx.lineTo(cx+23, goalLineBot+20);
  ctx.stroke();

  ctx.lineWidth = 2.5;

  ctx.beginPath();
  ctx.moveTo(cx-46, goalLineBot);
  ctx.lineTo(cx-46, goalLineBot+16);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(cx+46, goalLineBot);
  ctx.lineTo(cx+46, goalLineBot+16);
  ctx.stroke();
}

drawField();

let selectedColor = 'white';
let allPlayers = [];
let onField = [];
let pid = 0;
let saveTimer = null;

function setStatus(msg, type) {
  saveStatus.textContent = msg;
  saveStatus.className = 'save-status ' + (type || '');
}

function saveState() {
  try {

    const positions = onField.map(f => ({
      id: f.id,
      x: parseFloat(f.el.style.left),
      y: parseFloat(f.el.style.top)
    }));

    const state = {
      allPlayers,
      positions,
      pid
    };

    localStorage.setItem('afl_state_v2', JSON.stringify(state));

    console.log('Saved:', state);

    setStatus('✓ Saved', 'saved');

    clearTimeout(saveTimer);

    saveTimer = setTimeout(() => {
      setStatus('');
    }, 1500);

  } catch (e) {

    console.error(e);

    setStatus('Save failed', 'error');
  }
}

function loadState() {
  try {

    const raw = localStorage.getItem('afl_state_v2');

    if (!raw) {
      console.log('No save found');
      return;
    }

    const state = JSON.parse(raw);

    allPlayers = Array.isArray(state.allPlayers)
      ? state.allPlayers
      : [];

    pid = state.pid || 0;

    onField.forEach(f => f.el.remove());
    onField = [];

    if (Array.isArray(state.positions)) {

      state.positions.forEach(pos => {

        const p = allPlayers.find(pl => pl.id === pos.id);

        if (p) {
          spawnToken(p, pos.x, pos.y);
        }

      });
    }

    renderBench();

    console.log('Loaded:', state);

    setStatus('✓ Loaded saved data', 'saved');

    setTimeout(() => {
      setStatus('');
    }, 1500);

  } catch (e) {

    console.error('Load failed:', e);

    localStorage.removeItem('afl_state_v2');

    setStatus('Save reset', 'error');
  }
}

function selectColor(c) {
  selectedColor = c;

  document.getElementById('opt-white')
    .classList.toggle('selected', c === 'white');

  document.getElementById('opt-red')
    .classList.toggle('selected', c === 'red');
}

function addPlayer() {

  const input = document.getElementById('name-input');

  const name = input.value.trim();

  if (!name) return;

  const id = 'p' + (++pid);

  allPlayers.push({
    id,
    name,
    color: selectedColor
  });

  input.value = '';

  renderBench();

  saveState();
}

function renderBench() {

  const bench = document.getElementById('bench');

  bench.innerHTML = '';

  allPlayers.forEach(p => {

    const onF = onField.find(f => f.id === p.id);

    const chip = document.createElement('div');

    chip.className = 'bench-chip' + (onF ? ' on-field' : '');

    const dot = document.createElement('div');

    dot.className = 'chip-dot' + (p.color === 'red' ? ' red' : '');

    const label = document.createElement('span');

    label.textContent = p.name;

    const x = document.createElement('span');

    x.className = 'remove-x';
    x.textContent = '×';

    x.onclick = e => {
      e.stopPropagation();
      deletePlayer(p.id);
    };

    chip.appendChild(dot);
    chip.appendChild(label);
    chip.appendChild(x);

    if (!onF) {
      chip.onclick = () => placeOnField(p);
    }

    bench.appendChild(chip);
  });
}

function placeOnField(p) {

  spawnToken(
    p,
    38 + Math.random() * 24,
    42 + Math.random() * 16
  );

  saveState();
}

function spawnToken(p, xPct, yPct) {

  if (onField.find(f => f.id === p.id)) return;

  const el = document.createElement('div');

  el.className = 'player';

  el.style.left = xPct + '%';
  el.style.top = yPct + '%';

  const initials = p.name
    .split(' ')
    .map(w => w[0])
    .join('')
    .substring(0,2)
    .toUpperCase();

  el.innerHTML = `
    <div class="player-circle ${p.color==='red'?'red':''}">
      ${initials}
    </div>
    <div class="player-name">${p.name}</div>
  `;

  makeDraggable(el, p.id);

  playerLayer.appendChild(el);

  onField.push({
    id: p.id,
    el
  });

  renderBench();
}

function deletePlayer(id) {

  const fi = onField.findIndex(f => f.id === id);

  if (fi !== -1) {

    onField[fi].el.remove();

    onField.splice(fi, 1);
  }

  allPlayers = allPlayers.filter(p => p.id !== id);

  renderBench();

  saveState();
}

function clearAll() {

  onField.forEach(f => f.el.remove());

  onField = [];

  renderBench();

  saveState();
}

function makeDraggable(el, id) {

  let sx, sy, sl, st;
  let moved = false;
  let longTimer = null;

  const getRect = () =>
    playerLayer.getBoundingClientRect();

  el.addEventListener('touchstart', e => {

    const t = e.touches[0];

    sx = t.clientX;
    sy = t.clientY;

    sl = parseFloat(el.style.left);
    st = parseFloat(el.style.top);

    moved = false;

    el.style.zIndex = 20;

    longTimer = setTimeout(() => {

      if (!moved) {

        el.remove();

        onField = onField.filter(f => f.id !== id);

        renderBench();

        saveState();
      }

    }, 650);

  }, { passive: true });

  el.addEventListener('touchmove', e => {

    clearTimeout(longTimer);

    moved = true;

    e.stopPropagation();

    const t = e.touches[0];

    const r = getRect();

    el.style.left =
      Math.max(
        2,
        Math.min(
          98,
          sl + ((t.clientX - sx) / r.width) * 100
        )
      ) + '%';

    el.style.top =
      Math.max(
        2,
        Math.min(
          98,
          st + ((t.clientY - sy) / r.height) * 100
        )
      ) + '%';

  }, { passive: false });

  el.addEventListener('touchend', () => {

    clearTimeout(longTimer);

    el.style.zIndex = 5;

    if (moved) saveState();

  }, { passive: true });

  el.addEventListener('mousedown', e => {

    if (e.button !== 0) return;

    e.preventDefault();

    sx = e.clientX;
    sy = e.clientY;

    sl = parseFloat(el.style.left);
    st = parseFloat(el.style.top);

    el.style.zIndex = 20;

    const move = e2 => {

      const r = getRect();

      el.style.left =
        Math.max(
          2,
          Math.min(
            98,
            sl + ((e2.clientX - sx) / r.width) * 100
          )
        ) + '%';

      el.style.top =
        Math.max(
          2,
          Math.min(
            98,
            st + ((e2.clientY - sy) / r.height) * 100
          )
        ) + '%';
    };

    const up = () => {

      el.style.zIndex = 5;

      saveState();

      document.removeEventListener('mousemove', move);

      document.removeEventListener('mouseup', up);
    };

    document.addEventListener('mousemove', move);

    document.addEventListener('mouseup', up);
  });
}

// Save when tab/browser closes
window.addEventListener('beforeunload', saveState);

// Load saved state
loadState();

</script>
