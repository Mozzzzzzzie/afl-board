<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Elizabeth Eagles Tactics Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #1a2fa0;
    --gold: #f5b800;
    --gold-dark: #d4a000;
    --bg: #0f1a5c;
    --panel: #1a2fa0;
    --panel2: #162590;
    --text: white;
    --subtext: rgba(255,255,255,0.7);
    --border: rgba(255,255,255,0.15);
    --input-bg: rgba(255,255,255,0.08);
  }

  body {
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 12px 12px 40px; gap: 12px;
    color: var(--text);
  }

  /* HEADER */
  .club-header {
    width: min(92vw, 400px);
    background: linear-gradient(135deg, #1a2fa0, #0f1a5c);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    border: 1.5px solid var(--gold);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .club-logo { width: 64px; height: 64px; object-fit: contain; flex-shrink: 0; }
  .club-name { font-size: 22px; font-weight: 800; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; line-height: 1; }
  .club-sub { font-size: 11px; font-weight: 600; color: var(--subtext); letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }

  /* PANELS */
  .panel {
    width: min(92vw, 400px);
    background: var(--panel);
    border-radius: 14px; padding: 14px;
    border: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .panel-label {
    font-size: 10px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
  }

  /* COLOR ROW */
  .color-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .color-opt { flex: 1; padding: 7px; border-radius: 8px; border: 2px solid transparent; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.15s; }
  .color-opt.white-opt { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: white; }
  .color-opt.white-opt.selected { border-color: white; background: rgba(255,255,255,0.2); }
  .color-opt.gold-opt { background: var(--gold); color: #1a1a1a; border-color: var(--gold); }
  .color-opt.gold-opt.selected { border-color: white; box-shadow: 0 0 0 2px white; }

  /* INPUT */
  .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .input-row input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif;
    outline: none; color: white; background: var(--input-bg);
  }
  .input-row input::placeholder { color: rgba(255,255,255,0.4); }
  .input-row input:focus { border-color: var(--gold); }
  .add-btn {
    padding: 9px 18px; background: var(--gold); color: #1a1a1a;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 800;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
  }

  /* BENCH */
  .bench { display: flex; flex-wrap: wrap; gap: 6px; }
  .bench-chip {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.08); border: 1.5px solid var(--border);
    border-radius: 20px; padding: 4px 8px 4px 6px;
    font-size: 12px; font-weight: 600; color: white; cursor: pointer;
    transition: all 0.12s;
  }
  .bench-chip:active { background: rgba(255,255,255,0.15); }
  .bench-chip.on-field { opacity: 0.4; pointer-events: none; }
  .chip-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3); background: white; flex-shrink: 0; }
  .chip-dot.gold { background: var(--gold); border-color: var(--gold-dark); }
  .remove-x { margin-left: 2px; color: rgba(255,255,255,0.4); font-size: 14px; cursor: pointer; }

  /* GOALS */
  .goal-row {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px; margin-bottom: 5px;
  }
  .goal-name { flex: 1; font-size: 12px; font-weight: 600; color: white; }
  .goal-count { font-size: 14px; font-weight: 800; color: var(--gold); min-width: 24px; text-align: center; }
  .goal-btn {
    width: 28px; height: 28px; border-radius: 50%; border: none;
    font-size: 16px; font-weight: 700; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif;
  }
  .goal-plus { background: var(--gold); color: #1a1a1a; }
  .goal-minus { background: rgba(255,255,255,0.1); color: white; }

  /* BOG */
  .bog-row {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; margin-bottom: 5px;
    cursor: pointer; transition: all 0.15s;
  }
  .bog-row.selected { background: rgba(245,184,0,0.2); border-color: var(--gold); }
  .bog-num { font-size: 11px; font-weight: 800; color: var(--gold); min-width: 20px; }
  .bog-select {
    flex: 1; border: none; background: transparent; color: white;
    font-size: 13px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    outline: none; cursor: pointer;
  }
  .bog-select option { background: #1a2fa0; color: white; }
  .bog-star { font-size: 16px; }

  /* POSITIONS */
  .positions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .position-row {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 8px;
  }
  .position-name { font-size: 9px; font-weight: 700; color: var(--gold); min-width: 60px; text-transform: uppercase; letter-spacing: 0.5px; }
  .position-select {
    flex: 1; border: none; background: transparent; color: white;
    font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    outline: none; cursor: pointer;
  }
  .position-select option { background: #1a2fa0; color: white; }

  /* NOTES */
  .notes-textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-family: 'DM Sans', sans-serif;
    color: white; background: var(--input-bg); resize: vertical;
    min-height: 100px; outline: none; line-height: 1.5;
  }
  .notes-textarea::placeholder { color: rgba(255,255,255,0.35); }
  .notes-textarea:focus { border-color: var(--gold); }

  /* BUTTONS */
  .clear-btn {
    width: 100%; margin-top: 10px; padding: 8px; background: rgba(255,255,255,0.05);
    border: 1.5px solid var(--border); border-radius: 8px; font-size: 11px;
    font-weight: 700; color: rgba(255,255,255,0.5); cursor: pointer;
    font-family: 'DM Sans', sans-serif; letter-spacing: 1px; text-transform: uppercase;
  }
  .clear-btn:hover { border-color: rgba(255,100,100,0.5); color: rgba(255,100,100,0.8); }

  .save-status { text-align: center; font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px; min-height: 16px; }
  .save-status.saved { color: #4caf50; }
  .save-status.error { color: #e63946; }

  /* FIELD */
  #field-wrap { width: min(92vw, 400px); position: relative; }
  #fieldCanvas { width: 100%; border-radius: 12px; display: block; box-shadow: 0 6px 32px rgba(0,0,0,0.5); }
  #playerLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; touch-action: none; }

  .player { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; cursor: grab; touch-action: none; user-select: none; z-index: 5; }
  .player:active { cursor: grabbing; z-index: 20; }
  .player-circle {
    width: 38px; height: 38px; border-radius: 50%;
    background: white; border: 2.5px solid rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: #1a1a1a;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); text-align: center; line-height: 1.1; padding: 2px;
  }
  .player-circle.gold { background: var(--gold); color: #1a1a1a; border-color: var(--gold-dark); }
  .player-name { margin-top: 2px; background: rgba(0,0,0,0.75); color: white; font-size: 9px; font-weight: 600; padding: 1px 5px; border-radius: 3px; white-space: nowrap; }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tab-btn {
    flex: 1; padding: 7px 4px; border-radius: 8px; border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5);
    font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
    font-family: 'DM Sans', sans-serif; letter-spacing: 0.5px; transition: all 0.15s;
  }
  .tab-btn.active { background: var(--gold); color: #1a1a1a; border-color: var(--gold); }
</style>
</head>

<!-- ADD PLAYERS -->
<div class="panel">
  <div class="panel-label">Add Player</div>
  <div class="color-row">
    <div class="color-opt white-opt selected" id="opt-white" onclick="selectColor('white')">● White</div>
    <div class="color-opt gold-opt" id="opt-gold" onclick="selectColor('gold')">● Gold</div>
  </div>
  <div class="input-row">
    <input type="text" id="name-input" placeholder="Enter player name..." maxlength="14" onkeydown="if(event.key==='Enter')addPlayer()">
    <button class="add-btn" onclick="addPlayer()">Add</button>
  </div>
  <div class="panel-label">Tap name to place on field</div>
  <div class="bench" id="bench"></div>
  <button class="clear-btn" onclick="clearAll()">Clear Field</button>
  <div class="save-status" id="save-status"></div>
</div>

<!-- FIELD -->
<div id="field-wrap">
  <canvas id="fieldCanvas"></canvas>
  <div id="playerLayer"></div>
</div>

<!-- STATS TABS -->
<div class="panel">
  <div class="tabs">
    <div class="tab-btn active" id="tab-goals" onclick="showTab('goals')">⚽ Goals</div>
    <div class="tab-btn" id="tab-bog" onclick="showTab('bog')">🏆 Best on Ground</div>
    <div class="tab-btn" id="tab-pos" onclick="showTab('pos')">📋 Positions</div>
    <div class="tab-btn" id="tab-notes" onclick="showTab('notes')">📝 Notes</div>
  </div>

  <!-- GOALS TAB -->
  <div id="section-goals">
    <div class="panel-label">Goal Tally</div>
    <div id="goal-list"><div style="color:rgba(255,255,255,0.3);font-size:12px">Add players above to track goals</div></div>
  </div>

  <!-- BOG TAB -->
  <div id="section-bog" style="display:none">
    <div class="panel-label">Best on Ground — Pick Top 6</div>
    <div id="bog-list"></div>
  </div>

  <!-- POSITIONS TAB -->
  <div id="section-pos" style="display:none">
    <div class="panel-label">Positions</div>
    <div class="positions-grid" id="positions-grid"></div>
  </div>

  <!-- NOTES TAB -->
  <div id="section-notes" style="display:none">
    <div class="panel-label">Coach Notes</div>
    <textarea class="notes-textarea" id="notes-input" placeholder="Game plan, tactics, player instructions..."></textarea>
    <div class="save-status" id="notes-status"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('fieldCanvas');
const ctx = canvas.getContext('2d');
const playerLayer = document.getElementById('playerLayer');

const CW = 400, CH = 600;
canvas.width = CW; canvas.height = CH;
const cx = CW/2, cy = CH/2;
const ovalRx = 185, ovalRy = 284;
const arcR = 178;
const goalLineTop = cy - ovalRy;
const goalLineBot = cy + ovalRy;

const POSITIONS = [
  'Full Back','Back Pocket L','Back Pocket R',
  'Half Back L','Centre Half Back','Half Back R',
  'Wing L','Centre','Wing R',
  'Half Fwd L','Centre Half Fwd','Half Fwd R',
  'Fwd Pocket L','Fwd Pocket R','Full Forward',
  'Ruck','Ruck Rover','Rover',
  'Interchange 1','Interchange 2','Interchange 3','Interchange 4'
];

function drawField() {
  ctx.clearRect(0,0,CW,CH);
  function ovalPath() { ctx.beginPath(); ctx.ellipse(cx,cy,ovalRx,ovalRy,0,0,Math.PI*2); }
  ovalPath(); ctx.fillStyle='#2e9e2e'; ctx.fill();
  ctx.save(); ovalPath(); ctx.clip();
  ctx.strokeStyle='white'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx,goalLineTop,arcR,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,goalLineBot,arcR,0,Math.PI*2); ctx.stroke();
  const sq=89;
  ctx.beginPath(); ctx.rect(cx-sq,cy-sq,sq*2,sq*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx,cy,35,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth=3.5; ovalPath(); ctx.stroke();
  ctx.restore();
  ctx.strokeStyle='white';
  const gW=74,gH=28;
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.rect(cx-gW/2,goalLineTop,gW,gH); ctx.stroke();
  ctx.lineWidth=4.5;
  [[cx-23,goalLineTop-20,cx-23,goalLineTop],[cx+23,goalLineTop-20,cx+23,goalLineTop]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
  ctx.lineWidth=2.5;
  [[cx-46,goalLineTop-16,cx-46,goalLineTop],[cx+46,goalLineTop-16,cx+46,goalLineTop]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.rect(cx-gW/2,goalLineBot-gH,gW,gH); ctx.stroke();
  ctx.lineWidth=4.5;
  [[cx-23,goalLineBot,cx-23,goalLineBot+20],[cx+23,goalLineBot,cx+23,goalLineBot+20]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
  ctx.lineWidth=2.5;
  [[cx-46,goalLineBot,cx-46,goalLineBot+16],[cx+46,goalLineBot,cx+46,goalLineBot+16]].forEach(([x1,y1,x2,y2])=>{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();});
}
drawField();

let selectedColor='white', allPlayers=[], onField=[], pid=0;
let positions={}, goals={}, bog=Array(6).fill(''), notesTimer=null;

function setStatus(el,msg,type){ el.textContent=msg; el.className='save-status '+(type||''); setTimeout(()=>{el.textContent='';el.className='save-status';},2000); }

function saveState(){
  try {
    const fieldPos=onField.map(f=>({id:f.id,x:parseFloat(f.el.style.left),y:parseFloat(f.el.style.top)}));
    const notes=document.getElementById('notes-input').value;
    localStorage.setItem('afl_eagles_v1',JSON.stringify({allPlayers,fieldPos,pid,positions,goals,bog,notes}));
    setStatus(document.getElementById('save-status'),'✓ Saved','saved');
  } catch(e){ setStatus(document.getElementById('save-status'),'Save failed','error'); }
}

function loadState(){
  try {
    const raw=localStorage.getItem('afl_eagles_v1');
    if(!raw) return;
    const s=JSON.parse(raw);
    allPlayers=s.allPlayers||[]; pid=s.pid||0;
    positions=s.positions||{}; goals=s.goals||{}; bog=s.bog||Array(6).fill('');
    if(s.notes) document.getElementById('notes-input').value=s.notes;
    (s.fieldPos||[]).forEach(p=>{ const pl=allPlayers.find(x=>x.id===p.id); if(pl) spawnToken(pl,p.x,p.y); });
    renderBench(); renderGoals(); renderBog(); renderPositions();
    setStatus(document.getElementById('save-status'),'✓ Loaded','saved');
  } catch(e){}
}

document.getElementById('notes-input').addEventListener('input',()=>{
  clearTimeout(notesTimer);
  notesTimer=setTimeout(()=>{ saveState(); setStatus(document.getElementById('notes-status'),'✓ Notes saved','saved'); },800);
});

function showTab(t){
  ['goals','bog','pos','notes'].forEach(x=>{
    document.getElementById('section-'+x).style.display=x===t?'':'none';
    document.getElementById('tab-'+x).classList.toggle('active',x===t);
  });
}

function selectColor(c){
  selectedColor=c;
  document.getElementById('opt-white').classList.toggle('selected',c==='white');
  document.getElementById('opt-gold').classList.toggle('selected',c==='gold');
}

function addPlayer(){
  const inp=document.getElementById('name-input');
  const name=inp.value.trim(); if(!name) return;
  const id='p'+(++pid);
  allPlayers.push({id,name,color:selectedColor});
  if(!goals[id]) goals[id]=0;
  inp.value='';
  renderBench(); renderGoals(); renderBog(); renderPositions(); saveState();
}

function renderBench(){
  const bench=document.getElementById('bench'); bench.innerHTML='';
  allPlayers.forEach(p=>{
    const onF=onField.find(f=>f.id===p.id);
    const chip=document.createElement('div'); chip.className='bench-chip'+(onF?' on-field':'');
    const dot=document.createElement('div'); dot.className='chip-dot'+(p.color==='gold'?' gold':'');
    const label=document.createElement('span'); label.textContent=p.name;
    const x=document.createElement('span'); x.className='remove-x'; x.textContent='×';
    x.onclick=e=>{e.stopPropagation();deletePlayer(p.id);};
    chip.appendChild(dot); chip.appendChild(label); chip.appendChild(x);
    if(!onF) chip.onclick=()=>placeOnField(p);
    bench.appendChild(chip);
  });
}

function renderGoals(){
  const list=document.getElementById('goal-list'); list.innerHTML='';
  if(!allPlayers.length){ list.innerHTML='<div style="color:rgba(255,255,255,0.3);font-size:12px">Add players above to track goals</div>'; return; }
  allPlayers.forEach(p=>{
    if(!goals[p.id]) goals[p.id]=0;
    const row=document.createElement('div'); row.className='goal-row';
    const dot=document.createElement('div'); dot.className='chip-dot'+(p.color==='gold'?' gold':''); dot.style.marginRight='4px';
    const name=document.createElement('div'); name.className='goal-name'; name.textContent=p.name;
    const minus=document.createElement('button'); minus.className='goal-btn goal-minus'; minus.textContent='−';
    minus.onclick=()=>{ if(goals[p.id]>0){goals[p.id]--;renderGoals();saveState();} };
    const count=document.createElement('div'); count.className='goal-count'; count.textContent=goals[p.id];
    const plus=document.createElement('button'); plus.className='goal-btn goal-plus'; plus.textContent='+';
    plus.onclick=()=>{ goals[p.id]=(goals[p.id]||0)+1; renderGoals(); saveState(); };
    row.appendChild(dot); row.appendChild(name); row.appendChild(minus); row.appendChild(count); row.appendChild(plus);
    list.appendChild(row);
  });
}

function renderBog(){
  const list=document.getElementById('bog-list'); list.innerHTML='';
  const names=['— Select Player —',...allPlayers.map(p=>p.name)];
  for(let i=0;i<6;i++){
    const row=document.createElement('div'); row.className='bog-row'+(bog[i]&&bog[i]!=='— Select Player —'?' selected':'');
    const num=document.createElement('div'); num.className='bog-num'; num.textContent=(i+1)+'.';
    const sel=document.createElement('select'); sel.className='bog-select';
    names.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; if(bog[i]===n) o.selected=true; sel.appendChild(o); });
    sel.onchange=()=>{ bog[i]=sel.value; renderBog(); saveState(); };
    const star=document.createElement('div'); star.className='bog-star'; star.textContent=bog[i]&&bog[i]!=='— Select Player —'?'⭐':'☆';
    row.appendChild(num); row.appendChild(sel); row.appendChild(star);
    list.appendChild(row);
  }
}

function renderPositions(){
  const grid=document.getElementById('positions-grid'); grid.innerHTML='';
  const names=['— Unassigned —',...allPlayers.map(p=>p.name)];
  POSITIONS.forEach(pos=>{
    const row=document.createElement('div'); row.className='position-row';
    const label=document.createElement('div'); label.className='position-name'; label.textContent=pos;
    const sel=document.createElement('select'); sel.className='position-select';
    names.forEach(n=>{ const o=document.createElement('option'); o.value=n; o.textContent=n; if(positions[pos]===n) o.selected=true; sel.appendChild(o); });
    sel.onchange=()=>{ positions[pos]=sel.value; saveState(); };
    row.appendChild(label); row.appendChild(sel); grid.appendChild(row);
  });
}

function placeOnField(p){ spawnToken(p,38+Math.random()*24,42+Math.random()*16); saveState(); }

function spawnToken(p,xPct,yPct){
  const el=document.createElement('div'); el.className='player';
  el.style.left=xPct+'%'; el.style.top=yPct+'%';
  const initials=p.name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
  el.innerHTML=`<div class="player-circle ${p.color==='gold'?'gold':''}">${initials}</div><div class="player-name">${p.name}</div>`;
  makeDraggable(el,p.id);
  playerLayer.appendChild(el);
  onField.push({id:p.id,el});
  renderBench();
}

function deletePlayer(id){
  const fi=onField.findIndex(f=>f.id===id);
  if(fi!==-1){onField[fi].el.remove();onField.splice(fi,1);}
  allPlayers=allPlayers.filter(p=>p.id!==id);
  delete goals[id];
  renderBench(); renderGoals(); renderBog(); renderPositions(); saveState();
}

function clearAll(){ onField.forEach(f=>f.el.remove()); onField=[]; renderBench(); saveState(); }

function makeDraggable(el,id){
  let sx,sy,sl,st,moved=false,longTimer=null;
  const getRect=()=>playerLayer.getBoundingClientRect();
  el.addEventListener('touchstart',e=>{
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY;
    sl=parseFloat(el.style.left); st=parseFloat(el.style.top);
    moved=false; el.style.zIndex=20;
    longTimer=setTimeout(()=>{ if(!moved){el.remove();onField=onField.filter(f=>f.id!==id);renderBench();saveState();} },650);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    clearTimeout(longTimer); moved=true; e.stopPropagation();
    const t=e.touches[0]; const r=getRect();
    el.style.left=Math.max(2,Math.min(98,sl+((t.clientX-sx)/r.width)*100))+'%';
    el.style.top=Math.max(2,Math.min(98,st+((t.clientY-sy)/r.height)*100))+'%';
  },{passive:false});
  el.addEventListener('touchend',()=>{ clearTimeout(longTimer); el.style.zIndex=5; if(moved) saveState(); },{passive:true});
  el.addEventListener('mousedown',e=>{
    if(e.button!==0) return; e.preventDefault();
    sx=e.clientX; sy=e.clientY;
    sl=parseFloat(el.style.left); st=parseFloat(el.style.top); el.style.zIndex=20;
    const move=e2=>{ const r=getRect();
      el.style.left=Math.max(2,Math.min(98,sl+((e2.clientX-sx)/r.width)*100))+'%';
      el.style.top=Math.max(2,Math.min(98,st+((e2.clientY-sy)/r.height)*100))+'%';
    };
    const up=()=>{ el.style.zIndex=5; saveState(); document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); };
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  });
}

loadState();
</script>
</body>
</html>
